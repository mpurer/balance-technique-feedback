<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slackline Arm Detection MVP</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    video {
      display: none;
    }
    canvas {
      width: 100%;
      height: auto;
      transform: scaleX(-1);
    }
    #debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: lime;
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      max-height: 100px;
      overflow-y: auto;
      z-index: 9999;
    }
    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      color: yellow;
      font-family: Arial;
      font-size: 24px;
      z-index: 9999;
      text-shadow: 2px 2px 4px black;
    }
  </style>
</head>
<body>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="status">Loading...</div>
  <div id="debug">Debug:</div>

  <!-- Mediapipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const debugEl = document.getElementById("debug");
    const statusEl = document.getElementById("status");

    let debugLines = [];
    function log(msg) {
      console.log(msg);
      debugLines.push(msg);
      if (debugLines.length > 5) debugLines.shift();
      debugEl.textContent = debugLines.join("\n");
    }

    log("Starting...");

    // -----------------------------
    // Start camera with LOW resolution
    // -----------------------------
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 320 },
        height: { ideal: 240 }
      }
    })
    .then(stream => {
      log("Camera OK");
      video.srcObject = stream;
      video.onloadeddata = () => {
        log("Video: " + video.videoWidth + "x" + video.videoHeight);
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        startPose();
      };
    })
    .catch(err => {
      log("Camera error: " + err.message);
    });

    // -----------------------------
    // Initialize Mediapipe Pose - LITE model
    // -----------------------------
    let pose = null;
    let isProcessing = false;
    let frameCount = 0;

    function startPose() {
      log("Init Pose (lite)...");

      try {
        pose = new Pose({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
          modelComplexity: 0,  // LITE model for mobile
          smoothLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        // Initialize pose with a single frame first
        pose.initialize().then(() => {
          log("Pose ready!");
          requestAnimationFrame(processFrame);
        }).catch(err => {
          log("Init error: " + err.message);
          // Try anyway
          requestAnimationFrame(processFrame);
        });

      } catch(err) {
        log("ERROR: " + err.message);
      }
    }

    // Store latest pose results
    let latestLandmarks = null;

    // -----------------------------
    // Manual frame loop with throttling
    // -----------------------------
    function processFrame() {
      frameCount++;

      // Always draw video to canvas for smooth preview
      if (video.videoWidth > 0) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Draw stored landmarks on top
        if (latestLandmarks) {
          drawConnectors(ctx, latestLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
          drawLandmarks(ctx, latestLandmarks, {color: '#FF0000', radius: 3});
        }
      }

      // Only send to pose detection every 3rd frame to reduce load
      if (frameCount % 3 === 0 && !isProcessing && pose && video.videoWidth > 0) {
        isProcessing = true;
        pose.send({ image: video }).then(() => {
          isProcessing = false;
        }).catch(err => {
          isProcessing = false;
          log("Send err: " + err.message);
        });
      }

      requestAnimationFrame(processFrame);
    }

    // -----------------------------
    // Handle pose results
    // -----------------------------
    function onResults(results) {
      if (results.poseLandmarks) {
        // Store landmarks for continuous drawing
        latestLandmarks = results.poseLandmarks;

        // Arm detection
        const leftWrist = results.poseLandmarks[15];
        const rightWrist = results.poseLandmarks[16];
        const leftShoulder = results.poseLandmarks[11];
        const rightShoulder = results.poseLandmarks[12];

        const leftStatus = leftWrist.y < leftShoulder.y ? "L: UP" : "L: DOWN";
        const rightStatus = rightWrist.y < rightShoulder.y ? "R: UP" : "R: DOWN";

        statusEl.textContent = leftStatus + " | " + rightStatus;
      } else {
        statusEl.textContent = "No pose detected";
      }
    }
  </script>

</body>
</html>
